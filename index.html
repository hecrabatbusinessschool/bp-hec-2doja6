:root { --bg: #F7F8FA; --surface: #FFFFFF; --ink: #14213D; --muted: #5B6478; --line: #DDE1E8; --accent: #2F4B8F; --bad: #B42318 }

* { box-sizing: border-box }
html, body { height: 100% }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.5 "Helvetica Neue", Arial, sans-serif; display: grid; place-items: center; padding-inline: 16px }

p { margin: 0; color: var(--muted); font-size: 14px }
label { font-size: 13px; color: var(--muted) }
input { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); width: 100% }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
button { font: 600 15px inherit; font-family: inherit; padding: 11px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer }
button:disabled { opacity: .6; cursor: wait }
#err { color: var(--bad); font-size: 13px; min-height: 1em }
</style>
